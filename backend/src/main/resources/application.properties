spring.application.name=salary

# SQLite: a single file database; single writer is fine for one HR user.
spring.datasource.url=jdbc:sqlite:${SALARY_DB_PATH:./salary.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Flyway owns the schema. Hibernate validation is off because SQLite reports INTEGER
# (64-bit) where Hibernate expects BIGINT; PersistenceMappingTest covers the mappings instead.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health

# Demo data: deterministic, idempotent (skipped when employees exist).
app.seed.enabled=${SEED_ENABLED:true}
app.seed.count=10000
app.seed.random-seed=42
app.seed.as-of=2026-10-01

# API docs: interactive Swagger UI at /swagger-ui.html, OpenAPI spec at /v3/api-docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.paths-to-match=/api/**

# Hosting: Render (and most PaaS) tell the app which port to bind via $PORT.
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/csv,text/html,text/css,application/javascript,image/svg+xml
server.compression.min-response-size=1KB
