<div class="shell">
  <nav class="rail" aria-label="Main navigation">
    <a class="brand" routerLink="/insights" aria-label="Pay Atlas home">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="var(--pa-accent)" />
            <stop offset="1" stop-color="var(--pa-accent-2)" />
          </linearGradient>
        </defs>
        <circle cx="16" cy="16" r="11" fill="none" stroke="url(#brand-gradient)" stroke-width="2.4" />
        <ellipse cx="16" cy="16" rx="5" ry="11" fill="none" stroke="url(#brand-gradient)" stroke-width="1.7" />
        <path d="M5.5 12.5h21M5.5 19.5h21" stroke="url(#brand-gradient)" stroke-width="1.5" />
      </svg>
    </a>

    <a class="nav-item" routerLink="/insights" routerLinkActive="active" matTooltip="Insights" matTooltipPosition="right">
      <mat-icon>monitoring</mat-icon>
      <span class="label">Insights</span>
    </a>
    <a class="nav-item" routerLink="/employees" routerLinkActive="active" matTooltip="Employees" matTooltipPosition="right">
      <mat-icon>groups</mat-icon>
      <span class="label">Employees</span>
    </a>

    <span class="spacer"></span>

    <button
      type="button"
      class="nav-item"
      (click)="theme.toggle()"
      [matTooltip]="theme.mode() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      matTooltipPosition="right"
      [attr.aria-label]="theme.mode() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    >
      <mat-icon>{{ theme.mode() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
      <span class="label">Theme</span>
    </button>
  </nav>

  <div class="main">
    <header class="topbar">
      <div class="titles">
        <h1 class="display">{{ page().heading }}</h1>
        <p class="muted">{{ page().subheading }}</p>
      </div>
      @if (meta(); as meta) {
        <span class="fx-chip num" matTooltip="Org-wide figures are converted to USD with fixed, dated rates">
          <mat-icon>currency_exchange</mat-icon>
          USD · FX as of {{ meta.fxRatesAsOf }}
        </span>
      }
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
