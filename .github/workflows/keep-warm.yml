# Render's free tier sleeps after ~15 idle minutes and takes about a minute to wake up. Pinging the public health
# endpoint every 10 minutes keeps the demo responsive for reviewers.
#
# Caveats: GitHub may delay scheduled runs by several minutes under load (so the app can still occasionally sleep),
# and disables scheduled workflows after 60 days without repository activity. One always-on free service uses ~744
# of Render's 750 free instance hours a month.
name: Keep demo warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /actuator/health
        run: |
          # --retry covers a cold start; the step fails only if the app never answers healthy.
          curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors \
            https://salary-management-sg7p.onrender.com/actuator/health
