# Render's free tier sleeps after ~15 idle minutes and takes 2-3 minutes to wake up. Pinging the public health
# endpoint every 10 minutes is meant to keep the demo responsive for reviewers.
#
# Caveats: GitHub treats schedules as best effort. In practice this repo's runs started 2-4 hours apart, not every
# 10 minutes, so this workflow alone can't keep the app awake; an external uptime monitor is the reliable option
# (docs/DEPLOYMENT.md). GitHub also disables scheduled workflows after 60 days without repository activity.
# One always-on free service uses ~744 of Render's 750 free instance hours a month.
name: Keep demo warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping /actuator/health
        run: |
          # While the app wakes, Render answers 502 at once. Retry for ~3 minutes to cover a cold start; the step
          # fails only if the app never answers healthy.
          curl --fail --silent --show-error --max-time 60 --retry 12 --retry-delay 15 --retry-all-errors \
            https://salary-management-sg7p.onrender.com/actuator/health
